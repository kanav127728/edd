<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketchbook Finance Simulator</title>
    <style>
        /* Imports a hand-drawn looking font from Google */
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
        
        body {
            background-color: #fcf9f2;
            background-image: radial-gradient(#d3cabc 1px, transparent 1px);
            background-size: 20px 20px; /* Creates the sketchbook dotted paper look */
            font-family: 'Patrick Hand', cursive;
            color: #2c3e50;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { font-size: 3rem; text-align: center; color: #e74c3c; }
        
        /* CSS Trick to make borders look hand-drawn */
        .wallet {
            font-size: 2rem; background: #fff; padding: 10px 20px;
            border: 3px solid #34495e; 
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            display: inline-block; margin-bottom: 20px;
        }
        .level-card {
            background: #fff; padding: 20px; margin: 20px 0;
            border: 3px solid #2980b9; 
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }
        .btn {
            background: #27ae60; color: white; border: none; padding: 10px 20px;
            font-size: 1.5rem; font-family: 'Patrick Hand', cursive; cursor: pointer;
            border-radius: 10px; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        #log { margin-top: 15px; color: #8e44ad; font-size: 1.3rem; min-height: 30px;}
    </style>
</head>
<body>
    <h1>📘 The Money Sketchbook</h1>
    
    <div class="wallet">My Wallet: <span id="tokens">1000</span> 🪙</div>
    
    <div class="level-card">
        <h2>Level 1 (Age 7-8): The Magic Vault 🏦</h2>
        <p>Put 100 Tokens in the Fixed Deposit (FD) Vault. Wait 3 simulated years (3 seconds) to earn interest!</p>
        <button class="btn" onclick="investFD()">Lock 100 Tokens in FD</button>
        <div id="log"></div>
    </div>

    <script>
        let tokens = 1000;
        
        function investFD() {
            if(tokens < 100) {
                document.getElementById('log').innerText = "Not enough tokens to invest!";
                return;
            }
            
            // Deduct from wallet
            tokens -= 100;
            updateDisplay();
            document.getElementById('log').innerText = "⏳ 100 Tokens locked in FD... waiting for compound interest...";
            
            // Simulate time passing (3 seconds in real life = 3 years in game)
            setTimeout(() => {
                tokens += 120; // 20% total return
                updateDisplay();
                document.getElementById('log').innerText = "🎉 Magic Vault opened! You earned 120 Tokens (20% Profit)!";
            }, 3000);
        }
        
        function updateDisplay() {
            document.getElementById('tokens').innerText = tokens;
        }
    </script>
</body>
</html>
